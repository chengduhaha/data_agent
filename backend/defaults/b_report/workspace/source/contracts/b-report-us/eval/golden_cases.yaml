  intent: metric_lookup
  golden_ref: b-report-us#pm-735781-revenue-jan-2026
  table_fqn: dm_us.dm_disty_brpt_pm_mtd
  status: routing-certified
  snapshot_date: '2026-01-31'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
    entity_filters:
      pm_id: '735781'
  assertions:
    sql_shape:
      must_contain:
      - dm_disty_brpt_pm_mtd
      - pm_id
      - '735781'
      must_not_contain: []
    numeric:
      column: revenue
      expected: 638940.6584
      tolerance: 0.01
