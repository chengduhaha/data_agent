- id: ngm-jan-feb-2026
  question: What is the NGM amount for 2026 Jan and Feb?
  intent: metric_comparison
  golden_ref: b-report-us#ngm-jan-feb-2026
  table_fqn: dw_us.dws_disty_brpt_cust_mtd
  status: routing-certified
  snapshot_date: '2026-02-28'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - ngm_amt
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_cust_mtd
      - ngm_amt
      - dim_pub_date
      must_not_contain: []
  certified_sql: "SELECT 'Jan-2026' AS period_label, SUM(t.ngm_amt) AS ngm_amt\nFROM\
    \ dw_us.dws_disty_brpt_cust_mtd t\nJOIN (\n  SELECT MAX(date_flag) AS date_flag\n\
    \  FROM dim_us.dim_pub_date\n  WHERE date_flag >= '2026-01-01' AND date_flag <\
    \ '2026-02-01'\n) d ON t.date_flag = d.date_flag\nUNION ALL\nSELECT 'Feb-2026',\
    \ SUM(t.ngm_amt)\nFROM dw_us.dws_disty_brpt_cust_mtd t\nJOIN (\n  SELECT MAX(date_flag)\
    \ AS date_flag\n  FROM dim_us.dim_pub_date\n  WHERE date_flag >= '2026-02-01'\
    \ AND date_flag < '2026-03-01'\n) d ON t.date_flag = d.date_flag;"
- id: net-sales-yoy-jan-2026
  question: Please show net sales YoY% for 2026 Jan.
  intent: metric_comparison
  golden_ref: b-report-us#net-sales-yoy-jan-2026
  table_fqn: dw_us.dws_disty_brpt_cust_mtd
  status: routing-certified
  snapshot_date: '2026-01-31'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_cust_mtd
      - net_sales
      - yoy_pct
      must_not_contain:
      - dwd_disty_brpt_orders_pl_etl_mi
  certified_sql: "WITH month_ends AS (\n  SELECT MAX(CASE WHEN date_flag >= '2026-01-01'\
    \ AND date_flag < '2026-02-01' THEN date_flag END) AS jan26_end,\n         MAX(CASE\
    \ WHEN date_flag >= '2025-01-01' AND date_flag < '2025-02-01' THEN date_flag END)\
    \ AS jan25_end\n  FROM dim_us.dim_pub_date\n)\nSELECT ROUND(\n  (\n    SUM(CASE\
    \ WHEN t.date_flag = m.jan26_end THEN t.net_sales END)\n    / NULLIFZERO(SUM(CASE\
    \ WHEN t.date_flag = m.jan25_end THEN t.net_sales END))\n    - 1\n  ) * 100,\n\
    \  0\n) AS yoy_pct\nFROM dw_us.dws_disty_brpt_cust_mtd t\nCROSS JOIN month_ends\
    \ m\nWHERE t.date_flag IN (m.jan26_end, m.jan25_end);"
- id: jan-vendor-top5-ranking
  question: Top 5 vendors ranking by net sales for 2026 Jan.
  intent: ranking
  golden_ref: b-report-us#jan-vendor-top5-ranking
  table_fqn: dw_us.dws_disty_brpt_vend_mtd
  status: routing-certified
  snapshot_date: '2026-01-31'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_vend_mtd
      - vend_no
      - GROUP BY
      must_not_contain:
      - GROUP BY vend_name
      group_by_key: vend_no
    result_shape:
      min_rows: 1
      max_rows: 5
  certified_sql: "SELECT t.vend_no,\n       MAX(t.vend_name) AS vendor_name,\n   \
    \    SUM(t.net_sales) AS net_sales\nFROM dw_us.dws_disty_brpt_vend_mtd t\nWHERE\
    \ t.date_flag = '2026-01-31'\nGROUP BY t.vend_no\nORDER BY net_sales DESC\nLIMIT\
    \ 5;"
- id: pm-735781-revenue-jan-2026
