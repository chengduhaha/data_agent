- id: cdw-sub-customer-ranking
  question: 'if current month is 2026-05.For master customer: CDW LOGISTICS, what
    is net sales by each sub-customer for last month? List the top 20'
  intent: ranking
  golden_ref: b-report-us#cdw-sub-customer-ranking
  table_fqn: dw_us.dws_disty_brpt_cust_mtd
  status: routing-certified
  snapshot_date: '2026-04-30'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_cust_mtd
      - mcust_name
      - GROUP BY
      must_not_contain:
      - GROUP BY cust_name
      - dwd_disty_brpt_orders_pl_etl_mi
      group_by_key: cust_no
    result_shape:
      min_rows: 1
      max_rows: 20
  certified_sql: "SELECT t.cust_no,\n       MAX(t.cust_name) AS sub_customer,\n  \
    \     SUM(t.net_sales) AS net_sales\nFROM dw_us.dws_disty_brpt_cust_mtd t\nJOIN\
    \ (\n  SELECT date_flag,\n         ROW_NUMBER() OVER (ORDER BY date_flag DESC)\
    \ AS rn\n  FROM dim_us.dim_pub_date\n  WHERE date_flag >= '2026-04-01' AND date_flag\
    \ < '2026-05-01'\n) d ON t.date_flag = d.date_flag AND d.rn = 1\nWHERE t.mcust_name\
    \ = 'CDW LOGISTICS'\nGROUP BY t.cust_no\nORDER BY net_sales DESC\nLIMIT 20;"
- id: part-enn-525-revenue-margin
  question: tell me the revenue/margin for Part ENN-525
  intent: metric_lookup
  golden_ref: b-report-us#part-enn-525-revenue-margin
  table_fqn: dw_us.dws_disty_brpt_part_mtd
  status: routing-certified
  snapshot_date: '2026-06-20'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
    - ngm_amt
    entity_filters:
      part_identifier: ENN-525
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_part_mtd
      - dim_pub_part_info
      - part_no
      - net_sales
      - ngm_amt
      - ILIKE
      must_not_contain:
      - dim_sku
      - sku_no = 'ENN-525'
      - sku_no::varchar
  certified_sql: "WITH latest_period AS (\n  SELECT DATE_TRUNC('MONTH', MAX(date_flag))\
    \ AS month_start\n  FROM dim_us.dim_pub_date\n),\npart_scope AS (\n  SELECT sku_no,\
    \ part_no, mfg_partno\n  FROM dim_us.dim_pub_part_info\n  WHERE part_no = 'ENN-525'\n\
    \     OR mfg_partno = 'ENN-525'\n     OR part_no ILIKE '%ENN-525%'\n     OR mfg_partno\
    \ ILIKE '%ENN-525%'\n  LIMIT 20\n)\nSELECT SUM(t.net_sales) AS revenue,\n    \
    \   SUM(t.ngm_amt) AS margin_amt,\n       ROUND(SUM(t.ngm_amt) / NULLIFZERO(SUM(t.net_sales))\
    \ * 100, 2) AS margin_pct,\n       TO_CHAR(MAX(t.date_flag), 'YYYY-MM') AS period_label\n\
    FROM dw_us.dws_disty_brpt_part_mtd t\nJOIN part_scope p ON t.sku_no = p.sku_no\n\
    CROSS JOIN latest_period lp\nWHERE t.date_flag >= lp.month_start;"
- id: vpc-scanners-revenue-margin
  question: tell me the revenue/margin for VPC Scanners
  intent: metric_lookup
  golden_ref: b-report-us#vpc-scanners-revenue-margin
  table_fqn: dw_us.dws_disty_brpt_vpl_mtd
  status: routing-certified
  snapshot_date: '2026-06-23'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
    - ngm_amt
    entity_filters:
      vpc_group_label: Scanners
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_vpl_mtd
      - dim_pub_vpl_info
      - net_sales
      - ngm_amt
      - latest_period
      must_not_contain:
      - vpl_id
      - vpl_name
      - dim_pub_vpl_hierarchy_info
  certified_sql: "WITH latest_period AS (\n  SELECT DATE_TRUNC('MONTH', MAX(date_flag))\
    \ AS month_start\n  FROM dw_us.dws_disty_brpt_vpl_mtd\n),\nvpl_scope AS (\n  SELECT\
    \ vpl_no, vpl_code, vpl_desc, vpc_group_desc\n  FROM dim_us.dim_pub_vpl_info\n\
    \  WHERE vpc_group_desc ILIKE '%Scanner%'\n     OR vpl_desc ILIKE '%Scanner%'\n\
    \     OR vpl_code ILIKE '%Scanner%'\n  LIMIT 200\n)\nSELECT SUM(t.net_sales) AS\
    \ revenue,\n       SUM(t.ngm_amt) AS margin_amt,\n       ROUND(SUM(t.ngm_amt)\
    \ / NULLIFZERO(SUM(t.net_sales)) * 100, 2) AS margin_pct,\n       TO_CHAR(MAX(t.date_flag),\
    \ 'YYYY-MM') AS period_label\nFROM dw_us.dws_disty_brpt_vpl_mtd t\nJOIN vpl_scope\
    \ v ON t.vpl_no = v.vpl_no\nCROSS JOIN latest_period lp\nWHERE t.date_flag >=\
    \ lp.month_start;"
- id: cisco-vendor-net-sales-trend-2026
  question: 请给我看一下 2026 年 CISCO 的月度销售趋势数据。
  intent: trend
  golden_ref: b-report-us#cisco-vendor-net-sales-trend-2026
  table_fqn: dw_us.dws_disty_brpt_vend_mtd
  status: routing-certified
  snapshot_date: '2026-06-26'
  eval_mode: mock
  agent_test_level: full
  retrieval:
    resolved_metrics:
    - net_sales
    entity_filters:
      vendor_label: CISCO
  assertions:
    sql_shape:
      must_contain:
      - dws_disty_brpt_vend_mtd
      - dim_pub_vendor_info
      - month_ends
      - vendor_scope
      - period_label
      - net_sales
      - GROUP BY
      - ORDER BY period_label
      must_not_contain:
      - month_no
      - LIMIT 1
      - '202601'
    result_shape:
      min_rows: 1
  certified_sql: "WITH month_ends AS (\n  SELECT MAX(date_flag) AS date_flag\n  FROM\
    \ dim_us.dim_pub_date\n  WHERE date_flag >= '2026-01-01' AND date_flag <= '2026-12-31'\n\
    \  GROUP BY DATE_TRUNC('month', date_flag)\n),\nvendor_scope AS (\n  SELECT vend_no,\
    \ vend_name, master_vend_name, universal_vend_name, cis_mk_name, pur_vend_name\n\
    \  FROM dim_us.dim_pub_vendor_info\n  WHERE vend_name = 'CISCO'\n     OR vend_name\
    \ ILIKE '%CISCO%'\n     OR master_vend_name = 'CISCO'\n     OR master_vend_name\
    \ ILIKE '%CISCO%'\n     OR universal_vend_name ILIKE '%CISCO%'\n     OR cis_mk_name\
    \ ILIKE '%CISCO%'\n     OR pur_vend_name ILIKE '%CISCO%'\n  ORDER BY CASE WHEN\
    \ UPPER(vend_name) = UPPER('CISCO') THEN 0 ELSE 1 END,\n           CASE WHEN UPPER(master_vend_name)\
    \ = UPPER('CISCO') THEN 0 ELSE 1 END,\n           CASE WHEN UPPER(universal_vend_name)\
    \ = UPPER('CISCO') THEN 0 ELSE 1 END,\n           CASE WHEN UPPER(cis_mk_name)\
    \ = UPPER('CISCO') THEN 0 ELSE 1 END,\n           CASE WHEN UPPER(pur_vend_name)\
    \ = UPPER('CISCO') THEN 0 ELSE 1 END\n  LIMIT 200\n)\nSELECT TO_CHAR(t.date_flag,\
    \ 'YYYY-MM') AS period_label,\n       SUM(t.net_sales) AS net_sales\nFROM dw_us.dws_disty_brpt_vend_mtd\
    \ t\nJOIN vendor_scope s ON t.vend_no = s.vend_no\nJOIN month_ends m ON t.date_flag\
    \ = m.date_flag\nGROUP BY period_label\nORDER BY period_label;"
