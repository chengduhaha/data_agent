  - name: ngmAmt
    type: NUMERIC
    mapping: ngm_amt
    description: "NGM is the margin derived from product transactions after accounting\
      \ for cost, vendor funding (e.g., rebates, MDF, price protection,etc.), and\
      \ other deal-related adjustments, divided by net sales.\n\nIt is composed of\
      \ multiple P&L ITEMS and the formula is as followsï¼š\nngm_amt=\n( (nvl(u_price,0)-nvl(u_cost,0))*nvl(ship_qty,0)\n\
      \n+ nvl(BTL,0)+nvl(TRANS_BTL,0)\n\n+ nvl(ONE_TIME_BTL,0)\n\n+ nvl(HBTL,0)\n\n\
      + nvl(SCM_PROFIT_ADJ,0)\n\n+ nvl(BTL_BACKOUT,0)\n\n+ nvl(PDT,0)\n\n+ nvl(AP_FINANCE,0)\n\
      \n+ nvl(SCM_COST,0)\n\n+ nvl(SCM_RISK,0)\n\n+ nvl(INV_COST,0)\n\n+ nvl(INV_RESERVE,0)\n\
      \n+ nvl(INFRASTRUCTURE,0)\n\n+ nvl(MARKETING,0)\n\n+ nvl(FRT_OUT_LOAD,0)\n\n\
      + nvl(FRT_OUT_EXP,0) + nvl(FRT_OB_RECOVERY,0)\n\n+ nvl(FRT_IB_RECOVERY,0)\n\n\
      + nvl(WHOH_PACK ,0)\n\n+ nvl(CSGN_EDI_FEE,0)\n\n+ nvl(CUST_FINANCE,0) \n\n+\
      \ nvl(AR_FIN_RECOVERY,0)\n\n + nvl(CR_RISK_CTERM,0)\n\n+ nvl(CUST_PMT_DISC,0)\n\
      \n+ nvl(CUST_REBATE,0)+nvl(CVR_RM,0)\n\n+ nvl(DIRECT_CREDIT,0)\n\n+ nvl(FLR_SYNNEX,0)\n\
      \n+ nvl(RMA,0)\n\n+ nvl(MOF,0)\n\n+ nvl(MARGIN_SHARE,0)\n\n+ nvl(AP_ADJ,0)\n\
      \n+ nvl(CORPORATE,0)\n\n+ nvl(HC_PM,0)\n\n+ nvl(HC_BD,0)\n\n+ nvl(HC_SALES,0)\n\
      \n+ nvl(ORDER_OVERHEAD,0)\n\n+ nvl(OTHERS,0)\n\n+ nvl(MFG_OH,0)\n\n+ nvl(SFS,0)\n\
      \n)"
    visibility: default
  - name: dimPmId
    type: INT
    mapping: dim_pm_id
    visibility: default
  - name: netSales
    type: NUMERIC
    mapping: calc_net_sales
    description: The company's "verified and confirmed sales revenue", the amount
      after deducting various revenue deductions, NET_SALES = nvl(ship_qty,0) * (nvl(u_price,0)
      + nvl(u_sum_expense,0)). Mapped to calc_net_sales to avoid ambiguity with base
      table column net_sales.
    visibility: default
