- id: ShippedOrderLine
  physical_source: SELECT NVL(ngm_amt, 0)/ NULLIF(NVL(ship_qty, 0) * (NVL(u_price,
    0) + NVL(u_sum_expense, 0)),0) AS NGM_PCT, nvl(ship_qty,0) * (nvl(u_price,0) +
    nvl(u_sum_expense,0)) as calc_net_sales, (nvl(u_price,0)-nvl(u_cost,0))*nvl(ship_qty,0)
    as STANDARD_GM, nvl(ship_qty,0) * (nvl(u_price,0) - coalesce(sales_cost,u_cost,0))
    as SALES_GM,* FROM dw_us.dwd_disty_brpt_orders_pl_etl_mi WHERE segment_exclude
    ='N'
  description: Shipped and invoiced sales order line, not including open sales orders,
    key is order_no, order_type and order_line_no
  primary_key:
  - orderNo
  - orderType
  - orderLineNo
  properties:
  - name: dateFlag
    type: DATE
    mapping: date_flag
    visibility: default
