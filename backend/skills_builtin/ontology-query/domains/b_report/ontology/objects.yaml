    that purchases or receives products or services from TDSYNNEX. Customers can be
    end-users, resellers, or other businesses.
  primary_key:
  - custNo
  properties:
  - name: custNo
    type: INT32
    mapping: cust_no
    description: Customer ID
    visibility: prominent
  - name: custName
    type: STRING
    mapping: cust_name
    description: Customer Name
    visibility: prominent
  - name: outsideSalesRep
    type: INT32
    mapping: outside_sales_rep
    description: Assigned Sales Rep
    visibility: default
  - name: salesTerr
    type: INT
    mapping: sales_terr
    visibility: default
  - name: mcustNo
    type: INT32
    mapping: mcust_no
    description: Master customer this ship-to customer rolls up to
    visibility: default
  - name: outsideSalesRepName
    type: STRING
    mapping: outside_sales_rep_name
    description: Name of the outside sales rep assigned to this customer
    visibility: default
  - name: salesTerrName
    type: STRING
    mapping: sales_terr_name
    description: Name of the sales territory for this customer
    visibility: default
  - name: mcustName
    type: STRING
    mapping: mcust_name
    description: Master Customer Name
